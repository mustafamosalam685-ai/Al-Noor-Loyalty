<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Al Noor — Register</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<style>
:root{--panel:#211914;--cream:#f3ead9;--gold:#c9a96a;--muted:#aa9d8d;--line:#3b2d24}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#2a2019,#17120f 55%);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:520px;margin:auto;padding:35px 18px}.logo{width:145px;display:block;margin:8px auto 28px}.eyebrow{text-align:center;color:var(--gold);font-size:11px;letter-spacing:2px}.title{text-align:center;font-size:30px;margin:10px 0}.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:25px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 18px 45px #0007}.field{margin-top:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:15px;border-radius:14px;border:1px solid #4a392d;background:#2b211b;color:#fff;outline:none}
button{width:100%;padding:16px;border-radius:15px;border:0;font-weight:800;font-size:14px;cursor:pointer;margin-top:18px}.primary{background:var(--gold);color:#1d150f}.secondary{background:#33271f;color:var(--cream);border:1px solid #4a392d}
.status{text-align:center;color:var(--gold);font-size:12px;min-height:20px;margin-top:14px;line-height:1.5}.footer{text-align:center;color:#766b60;font-size:11px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
<img class="logo" src="logo-1995.png" alt="Al Noor">
<div class="eyebrow">AL NOOR • LOYALTY</div>
<div class="title">Welcome to Al Noor</div>
<div class="sub">Create your Al Noor Loyalty Card.</div>
<div class="panel">
<div class="field"><label>Full Name</label><input id="name" autocomplete="name" placeholder="Enter your full name"></div>
<div class="field"><label>Mobile</label><input id="mobile" type="tel" autocomplete="tel" placeholder="Enter your mobile number"></div>
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="Enter your email"></div>
<button id="createBtn" class="primary">CREATE MY LOYALTY CARD</button>
<div id="status" class="status"></div>
<button class="secondary" onclick="location.href='login.html'">I ALREADY HAVE AN ACCOUNT</button>
</div>
<div class="footer">AL NOOR • LOYALTY MEMBER</div>
</div>

<script>
const SUPABASE_URL="https://fgarlyoqobopudfkifbp.supabase.co";
const SUPABASE_KEY="sb_publishable_hmDY0NchM_WPIMRXW26-HA_eaLaVZcY";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,experimental:{passkey:true}}});

async function createAccount(){
  const name=document.getElementById("name").value.trim();
  const mobile=document.getElementById("mobile").value.trim();
  const email=document.getElementById("email").value.trim().toLowerCase();
  const status=document.getElementById("status");
  const btn=document.getElementById("createBtn");

  if(!name||!mobile||!email){status.textContent="Please complete all fields.";return}

  btn.disabled=true;status.textContent="Creating your account...";

  try{
    const password=crypto.randomUUID()+"Aa9!";
    const {data,error}=await sb.auth.signUp({
      email,password,
      options:{data:{full_name:name,mobile}}
    });

    if(error)throw new Error(error.message);

    if(!data.session){
      status.textContent="Account created. Please confirm your email, then return to SIGN IN. Your name and mobile are saved with your account.";
      return;
    }

    const r=await sb.rpc("register_customer_authenticated",{
      p_full_name:name,p_mobile:mobile,p_email:email
    });
    if(r.error)throw new Error(r.error.message||"Could not create loyalty card.");

    const customer=r.data;
    if(!customer?.public_token)throw new Error("Loyalty card was not created correctly.");

    localStorage.setItem("alnoor_public_token",customer.public_token);
    location.href="card.html?token="+encodeURIComponent(customer.public_token)+"&new=1";
  }catch(e){
    status.textContent=e?.message||"Registration failed.";
  }finally{
    btn.disabled=false;
  }
}
document.getElementById("createBtn").onclick=createAccount;
</script>
</body>
</html>
