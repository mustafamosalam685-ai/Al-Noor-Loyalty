<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al Noor Loyalty Card</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{margin:0;background:#120e0b;color:#f3e7d0;font-family:Arial;text-align:center}.wrap{max-width:520px;margin:auto;padding:25px 18px 100px}.card{background:#211912;border:1px solid #80653c;border-radius:25px;padding:22px}.logo{width:58px;height:58px;border:1px solid #b99555;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;color:#c9a15e;font-weight:bold}.brand{color:#c9a15e;letter-spacing:3px;font-size:13px}.pill{display:inline-block;border:1px solid #927443;border-radius:20px;padding:7px 12px;font-size:11px;color:#d7bd8a;margin:20px 0}.name{font-size:28px;font-weight:bold}.id{color:#9f927f;font-size:12px;margin-top:6px}.qr{width:300px;height:300px;max-width:100%;background:#fff;border-radius:20px;margin:24px auto 14px;display:grid;place-items:center}.points,.face{margin-top:16px;padding:20px;border-radius:20px;background:#19130f;border:1px solid #55442c}.circle{width:110px;height:110px;border-radius:50%;border:8px solid #8e7042;display:grid;place-items:center;margin:auto}.circle b{font-size:28px}.circle small{display:block}.more{margin-top:12px;color:#c8b99f;font-size:12px}button{width:100%;padding:15px;border:0;border-radius:14px;background:#c9a15e;color:#17120e;font-weight:bold;margin-top:12px}button.alt{background:transparent;color:#c9a15e;border:1px solid #6f5835}.status{color:#c9a15e;font-size:12px;min-height:18px;margin-top:10px}.error{padding:60px 20px;color:#e0b3a5}
</style></head><body><main id="app" class="wrap">Loading...</main>
<script>
const URL="https://fgarlyoqobopudfkifbp.supabase.co",KEY="sb_publishable_hmDY0NchM_WPIMRXW26-HA_eaLaVZcY";
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,experimental:{passkey:true}}});
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function customer(){
 const {data:{session}}=await sb.auth.getSession();
 if(session){const r=await sb.rpc("get_my_customer");if(!r.error&&r.data)return r.data}
 const t=new URLSearchParams(location.search).get("token")||localStorage.getItem("alnoor_public_token");
 if(t){const r=await sb.rpc("get_customer_by_token",{p_token:t});if(!r.error&&r.data)return r.data}
 return null
}
async function passkeyExists(){try{const r=await sb.auth.passkey.list();return !r.error&&Array.isArray(r.data)&&r.data.length>0}catch(e){return false}}
async function activate(){
 const b=document.getElementById("face");if(b)b.disabled=true;document.getElementById("status").textContent="Waiting for Face ID / device verification...";
 try{
  const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById("status").textContent="Please sign in first.";return}
  if(!window.isSecureContext||!window.PublicKeyCredential){document.getElementById("status").textContent="Passkey is not supported here.";return}
  const r=await sb.auth.registerPasskey();if(r.error){document.getElementById("status").textContent=r.error.message;return}
  document.getElementById("status").textContent="Face ID is now active on this device.";setTimeout(render,700)
 }catch(e){document.getElementById("status").textContent=e?.message||"Face ID activation failed."}
 finally{if(b)b.disabled=false}
}
async function logout(){await sb.auth.signOut();localStorage.removeItem("alnoor_public_token");location.href="login.html"}
async function render(){
 const c=await customer();if(!c){app.innerHTML='<div class="error"><h2>Customer card not found</h2><button onclick="location.href=\'login.html\'">SIGN IN</button></div>';return}
 if(c.public_token)localStorage.setItem("alnoor_public_token",c.public_token);
 const p=Number(c.points||0),n=p%10,more=n?10-n:10,active=await passkeyExists();
 app.innerHTML=`<div class="logo">AN</div><div class="brand">AL NOOR LOYALTY</div><section class="card"><div class="pill">AL NOOR FAMILY</div><div>Welcome back</div><div class="name">${esc(c.full_name)}</div><div class="id">CUSTOMER ID · ${esc(c.customer_code)}</div><div class="qr"><div id="q"></div></div><div style="color:#a99d8b;font-size:12px">Show this QR code at the counter</div><div class="points"><div class="circle"><div><b>${n}/10</b><small>POINTS</small></div></div><div class="more">${more} MORE POINTS UNTIL YOUR NEXT FREE DRINK!</div></div><div class="face"><h3>${active?"✓ Face ID Active":"Activate Face ID"}</h3><p style="color:#a99d8b;font-size:12px">${active?"This device already has a Passkey for your Al Noor account.":"Activate Face ID once on this device. Then you can sign in without typing your email."}</p>${active?"":'<button id="face" onclick="activate()">ACTIVATE FACE ID</button>'}<div id="status" class="status"></div></div><button class="alt" onclick="logout()">SIGN OUT</button></section>`;
 if(c.public_token)new QRCode(q,{text:String(c.public_token),width:272,height:272,colorDark:"#111",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.H})
}
render();
</script></body></html>
