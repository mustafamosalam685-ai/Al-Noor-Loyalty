<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0906"><title>Al Noor — Menu</title><style>
:root{--bg:#0d0906;--panel:#17100b;--cream:#f7efe1;--muted:#b9a58d;--gold:#d9a34a;--gold2:#f0c979;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,rgba(8,5,3,.78),rgba(8,5,3,.97)),url("cafe.jpg") center/cover fixed no-repeat;min-height:100vh}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.app{width:min(720px,100%);margin:auto;padding:14px 12px 110px}
.top{display:flex;align-items:center;gap:12px;padding:5px 4px 18px}
.logo{width:64px;height:64px;object-fit:contain}.brand h1{font-family:Georgia,serif;margin:0;font-size:25px;letter-spacing:1.5px}.brand small{color:var(--gold2);letter-spacing:1.8px;font-size:9px}
.glass{background:rgba(19,12,8,.80);border:1px solid var(--line);border-radius:26px;box-shadow:0 22px 60px rgba(0,0,0,.38);backdrop-filter:blur(18px)}
.page-title{font-family:Georgia,serif;font-size:31px;margin:8px 0}.page-sub{color:var(--muted);line-height:1.5;font-size:13px}
.card{padding:20px;margin-top:14px}.btn{display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:13px;padding:12px 16px;background:linear-gradient(135deg,#e4ba68,#b97b31);color:#24160b;font-weight:800}.btn.full{width:100%}
.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.8px;background:rgba(217,163,74,.16);color:var(--gold2);border:1px solid rgba(217,163,74,.25)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.bottom-nav{position:fixed;z-index:50;left:50%;bottom:12px;transform:translateX(-50%);width:min(720px,calc(100% - 20px));height:76px;padding:7px 8px;border-radius:25px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:rgba(15,10,7,.94);border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 55px rgba(0,0,0,.6);backdrop-filter:blur(20px)}
.nav{border:0;background:none;color:#968b80;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px}.nav b{font-size:21px;font-weight:500;line-height:1}.nav.active{color:var(--gold2)}
.nav.center .circle{width:58px;height:58px;border-radius:50%;margin-top:-25px;background:#17100b;border:1px solid var(--gold2);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(217,163,74,.08)}.nav.center img{width:44px;height:44px;object-fit:contain}.nav.center span:last-child{color:var(--gold2);letter-spacing:1px}
@media(max-width:500px){.app{padding:10px 10px 108px}.page-title{font-size:28px}.logo{width:56px;height:56px}}

.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#eee;border-radius:999px;padding:9px 13px;font-size:11px}.tab.active{background:var(--gold2);color:#26180b;border-color:transparent}.items{display:grid;gap:9px}.item{padding:15px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.035);display:flex;justify-content:space-between;gap:15px}.item h3{margin:0;font-size:14px}.item p{margin:5px 0 0;color:var(--muted);font-size:11px}.price{color:var(--gold2);font-weight:800;white-space:nowrap}
</style></head><body><main class="app"><header class="top"><img class="logo" src="logo-1995.png"><div class="brand"><h1>AL NOOR</h1><small>MENU • MODERN BAKERY & CAFÉ</small></div></header><h1 class="page-title">Our Menu</h1><p class="page-sub">Menu only. No customer information appears here.</p><section class="card glass"><div id="tabs" class="tabs"></div><div id="items" class="items"></div></section></main><nav class="bottom-nav"><a class="nav " href="index.html" data-page="index.html"><b>⌂</b><span>Home</span></a><a class="nav " href="rewards.html" data-page="rewards.html"><b>♧</b><span>Rewards</span></a><a class="nav center" href="alnoor.html" data-page="alnoor.html"><span class="circle"><img src="logo-1995.png"></span><span>AL NOOR</span></a><a class="nav " href="locations.html" data-page="locations.html"><b>⌖</b><span>Locations</span></a><a class="nav active" href="menu.html" data-page="menu.html"><b>☰</b><span>Menu</span></a></nav><script>
const MENU={Coffee:[["Espresso","Classic espresso","12 AED"],["Americano","Espresso with hot water","14 AED"],["Cappuccino","Espresso, milk and foam","16 AED"],["Latte","Smooth espresso with steamed milk","16 AED"],["Spanish Latte","Creamy signature latte","18 AED"],["Caramel Macchiato","Espresso, milk and caramel","18 AED"],["Mocha","Chocolate espresso drink","18 AED"]],Bakery:[["Croissant","Freshly baked","12 AED"],["Chocolate Croissant","Buttery pastry with chocolate","14 AED"],["Cookies","Fresh baked cookies","12 AED"],["Muffin","Fresh bakery muffin","14 AED"],["Banana Bread","Freshly baked","14 AED"]],Breakfast:[["Egg Sandwich","Fresh breakfast sandwich",""],["Manakish","Freshly baked Arabic flatbread",""],["Breakfast Selection","Fresh bakery breakfast options",""]],Desserts:[["Cake Selection","Fresh cakes and slices",""],["Arabic Sweets","Traditional selection",""],["Cookies","Freshly baked cookies",""]],"Cold Drinks":[["Iced Latte","Chilled espresso and milk",""],["Iced Americano","Chilled espresso and water",""],["Fresh Juice","Freshly prepared",""]]};
let active=Object.keys(MENU)[0];
function render(){document.getElementById("tabs").innerHTML=Object.keys(MENU).map(k=>'<button class="tab '+(k===active?"active":"")+'" onclick="active='+JSON.stringify(k)+';render()">'+k+'</button>').join("");document.getElementById("items").innerHTML=MENU[active].map(x=>'<div class="item"><div><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div><div class="price">'+(x[2]||"—")+'</div></div>').join("")}render();
</script></body></html>
