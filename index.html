<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#65752b">

<title>Al Noor Loyalty</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
    color:#222;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:24px;
    padding:25px;
    margin-top:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    color:#65752b;
    font-size:30px;
    font-weight:bold;
    letter-spacing:1px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-top:5px;
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:14px;
    border:0;
    border-radius:12px;
    background:#65752b;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.secondary{
    background:#333;
}

.message{
    text-align:center;
    margin-top:15px;
}

.error{
    color:#b00020;
}

.success{
    color:green;
}

.hidden{
    display:none;
}

.customer-name{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin-top:15px;
}

.points-box{
    text-align:center;
    margin:20px 0;
}

.points{
    font-size:65px;
    font-weight:bold;
    color:#65752b;
}

.points-label{
    color:#777;
    font-size:14px;
}

.info{
    background:#f5f5f5;
    padding:13px;
    margin-top:8px;
    border-radius:12px;
}

.qr-box{
    text-align:center;
    margin-top:20px;
}

.qr-box img{
    width:220px;
    height:220px;
    border-radius:10px;
}

.qr-title{
    font-weight:bold;
    margin-bottom:10px;
}

.note{
    text-align:center;
    color:#777;
    font-size:13px;
    line-height:1.5;
    margin-top:12px;
}

.refresh{
    background:#555;
}

</style>

</head>

<body>

<div class="container">


<!-- =========================
     REGISTRATION
========================= -->

<div id="registerCard"
     class="card">

    <div class="logo">
        AL NOOR
    </div>

    <div class="subtitle">
        Modern Bakery
    </div>

    <h2>
        Loyalty Registration
    </h2>

    <input
        id="name"
        type="text"
        placeholder="Full Name"
    >

    <input
        id="mobile"
        type="tel"
        placeholder="Mobile Number"
    >

    <input
        id="email"
        type="email"
        placeholder="Email (Optional)"
    >

    <button
        onclick="registerCustomer()">
        CREATE LOYALTY CARD
    </button>

    <div
        id="registerMessage"
        class="message">
    </div>

</div>


<!-- =========================
     CUSTOMER CARD
========================= -->

<div id="customerCard"
     class="card hidden">

    <div class="logo">
        AL NOOR
    </div>

    <div class="subtitle">
        Loyalty Card
    </div>

    <div
        id="customerName"
        class="customer-name">
    </div>


    <!-- POINTS -->

    <div class="points-box">

        <div
            id="points"
            class="points">
            0
        </div>

        <div class="points-label">
            LOYALTY POINTS
        </div>

    </div>


    <!-- CUSTOMER DATA -->

    <div class="info">
        Customer ID:
        <strong id="customerCode"></strong>
    </div>

    <div class="info">
        Visits:
        <strong id="visits"></strong>
    </div>

    <div class="info">
        Reward:
        <strong id="reward"></strong>
    </div>

    <div class="info">
        Status:
        <strong id="status"></strong>
    </div>


    <!-- QR -->

    <div class="qr-box">

        <div class="qr-title">
            YOUR CUSTOMER QR
        </div>

        <img
            id="customerQR"
            alt="Customer QR Code">

        <div class="note">
            Show this QR code to the staff
            when you visit Al Noor.
        </div>

    </div>


    <!-- SAVE -->

    <button
        onclick="saveCard()">
        📱 SAVE MY LOYALTY CARD
    </button>


    <!-- REFRESH -->

    <button
        class="refresh"
        onclick="refreshCustomer()">
        🔄 REFRESH POINTS
    </button>


    <div
        id="cardMessage"
        class="message">
    </div>

</div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://fgarlyoqobopudfkifbp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hmDY0NchM_WPIMRXW26-HA_eaLaVZcY";


/* =========================
   VARIABLES
========================= */

let currentToken = null;


/* =========================
   PAGE LOAD
========================= */

window.addEventListener(
    "load",
    function(){

        const params =
        new URLSearchParams(
            window.location.search
        );

        const token =
        params.get("token");


        if(token){

            currentToken = token;

            loadCustomer(token);

        }

    }
);


/* =========================
   REGISTER CUSTOMER
========================= */

async function registerCustomer(){

    const name =
    document.getElementById(
        "name"
    ).value.trim();


    const mobile =
    document.getElementById(
        "mobile"
    ).value.trim();


    const email =
    document.getElementById(
        "email"
    ).value.trim();


    const message =
    document.getElementById(
        "registerMessage"
    );


    if(!name){

        message.className =
        "message error";

        message.innerText =
        "Please enter your name.";

        return;

    }


    if(!mobile){

        message.className =
        "message error";

        message.innerText =
        "Please enter your mobile number.";

        return;

    }


    message.className =
    "message";

    message.innerText =
    "Creating your loyalty card...";


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/rpc/register_customer",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY

                },

                body:JSON.stringify({

                    p_full_name:
                    name,

                    p_mobile:
                    mobile,

                    p_email:
                    email || null

                })

            }

        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const customer =
        await response.json();


        currentToken =
        customer.public_token;


        window.location.href =
            window.location.pathname +
            "?token=" +
            encodeURIComponent(
                currentToken
            );

    }

    catch(error){

        message.className =
        "message error";

        message.innerText =
        "Error: " +
        error.message;

    }

}


/* =========================
   LOAD CUSTOMER
========================= */

async function loadCustomer(token){

    document.getElementById(
        "registerCard"
    ).classList.add("hidden");


    document.getElementById(
        "customerCard"
    ).classList.remove("hidden");


    const message =
    document.getElementById(
        "cardMessage"
    );


    message.className =
    "message";


    message.innerText =
    "Loading your loyalty card...";


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/rpc/get_customer_by_token",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY

                },

                body:JSON.stringify({

                    p_token:
                    token

                })

            }

        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const data =
        await response.json();


        if(!data ||
           data.length === 0){

            throw new Error(
                "Customer not found."
            );

        }


        const customer =
        data[0];


        displayCustomer(
            customer,
            token
        );


        message.className =
        "message success";

        message.innerText =
        "✓ Card updated";


    }

    catch(error){

        message.className =
        "message error";

        message.innerText =
        error.message;

    }

}


/* =========================
   DISPLAY CUSTOMER
========================= */

function displayCustomer(
    customer,
    token
){

    document.getElementById(
        "customerName"
    ).innerText =
    customer.full_name || "";


    document.getElementById(
        "customerCode"
    ).innerText =
    customer.customer_code || "";


    document.getElementById(
        "points"
    ).innerText =
    customer.points ?? 0;


    document.getElementById(
        "visits"
    ).innerText =
    customer.visits ?? 0;


   const points = Number(customer.points || 0);

let rewardText = "No Reward";

if (points >= 10) {
    rewardText = "FREE DRINK READY 🎁";
}

document.getElementById("reward").textContent = rewardText;

    document.getElementById(
        "status"
    ).innerText =
    customer.status ||
    "Active";


    /*
       QR يحتوي على نفس رابط
       كارت العميل.
    */

    const customerURL =
        window.location.origin +
        window.location.pathname +
        "?token=" +
        encodeURIComponent(
            token
        );


    document.getElementById(
        "customerQR"
    ).src =
        "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=" +
        encodeURIComponent(
            customerURL
        );

}


/* =========================
   REFRESH POINTS
========================= */

async function refreshCustomer(){

    if(!currentToken){
        return;
    }


    await loadCustomer(
        currentToken
    );

}


/* =========================
   SAVE CARD
========================= */

async function saveCard(){

    const message =
    document.getElementById(
        "cardMessage"
    );


    /*
       Android / supported browsers
    */

    if(
        window.matchMedia(
            "(display-mode: browser)"
        ).matches &&
        window.deferredPrompt
    ){

        window.deferredPrompt.prompt();

        const result =
        await window.deferredPrompt.userChoice;

        window.deferredPrompt =
        null;

        return;

    }


    /*
       iPhone
    */

    const isIOS =
        /iPhone|iPad|iPod/i.test(
            navigator.userAgent
        );


    if(isIOS){

        message.className =
        "message success";

        message.innerHTML =
        "📱 To save AL NOOR:<br><br>" +
        "Tap <b>Share</b> in Safari " +
        "then choose <b>Add to Home Screen</b>.";

        return;

    }


    /*
       Other devices
    */

    message.className =
    "message success";

    message.innerHTML =
    "Open your browser menu and choose " +
    "<b>Add to Home Screen</b>.";

}


/* =========================
   PWA INSTALL
========================= */

window.addEventListener(
    "beforeinstallprompt",
    function(event){

        event.preventDefault();

        window.deferredPrompt =
        event;

    }
);

</script>

</body>
</html>
