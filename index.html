<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Noor Loyalty Card</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,sans-serif; background:#f3f0e8; padding:24px;
}
.card{
  width:min(390px,100%); border-radius:28px; overflow:hidden;
  background:#fff; box-shadow:0 18px 45px rgba(0,0,0,.18);
}
.header{
  padding:28px 24px 22px; background:#33483a; color:#fff;
}
.brand{font-size:14px; letter-spacing:2px; opacity:.9}
.title{font-size:28px; font-weight:700; margin-top:8px}
.body{padding:24px}
.name{font-size:24px;font-weight:700;color:#26352b}
.id{color:#777;margin-top:5px}
.points{
  margin-top:22px; padding:20px; border-radius:20px;
  background:#f0eee6; text-align:center;
}
.points strong{display:block;font-size:42px;color:#33483a}
.points span{font-size:14px;color:#666}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat{padding:15px;border:1px solid #e3e0d7;border-radius:16px}
.stat b{display:block;font-size:19px;color:#33483a}
.stat small{color:#777}
.reward{
  margin-top:14px;padding:16px;border-radius:16px;
  background:#33483a;color:#fff
}
.reward small{opacity:.8}
.actions{padding:0 24px 26px}
button{
  width:100%; border:0; border-radius:15px; padding:15px;
  margin-top:10px; font-size:16px; font-weight:700; cursor:pointer;
}
.wallet{background:#111;color:#fff}
.google{background:#fff;color:#222;border:1px solid #ccc}
.note{font-size:11px;color:#888;text-align:center;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="brand">AL NOOR MODERN BAKERY</div>
    <div class="title">LOYALTY CARD</div>
  </div>
  <div class="body">
    <div class="name" id="name">Customer</div>
    <div class="id" id="id">Customer ID</div>

    <div class="points">
      <strong id="points">0</strong>
      <span>LOYALTY POINTS</span>
    </div>

    <div class="stats">
      <div class="stat"><b id="visits">0</b><small>Visits</small></div>
      <div class="stat"><b id="spend">0 AED</b><small>Total Spend</small></div>
    </div>

    <div class="reward">
      <small>Current Reward</small>
      <div id="reward" style="font-size:20px;font-weight:700;margin-top:5px">No reward</div>
    </div>
  </div>

  <div class="actions">
    <button class="wallet" onclick="alert('Apple Wallet integration will be connected in the next step.')">Add to Apple Wallet</button>
    <button class="google" onclick="alert('Google Wallet integration will be connected in the next step.')">Add to Google Wallet</button>
    <div class="note">Al Noor Loyalty • Your points and rewards will be connected to the loyalty system.</div>
  </div>
</div>

<script>
const customers = {
  C0001:{name:"Ahmed Mohamed",points:6,visits:12,spend:"450 AED",reward:"2 Cups"},
  C0002:{name:"Sara Ali",points:3,visits:7,spend:"280 AED",reward:"1 Cup"},
  C0003:{name:"Mohamed",points:8,visits:15,spend:"620 AED",reward:"FREE DRINK"}
};

const id = new URLSearchParams(location.search).get("id") || "C0002";
const c = customers[id] || customers.C0002;

document.getElementById("name").textContent=c.name;
document.getElementById("id").textContent="Customer ID: "+id;
document.getElementById("points").textContent=c.points;
document.getElementById("visits").textContent=c.visits;
document.getElementById("spend").textContent=c.spend;
document.getElementById("reward").textContent=c.reward;
</script>
</body>
</html>
