<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Al Noor Loyalty</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{--bg:#17120f;--panel:#211914;--cream:#f3ead9;--gold:#c9a96a;--muted:#aa9d8d;--line:#3b2d24}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#2a2019 0,#17120f 48%);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:auto;padding:32px 18px 110px}
.logo{width:145px;display:block;margin:8px auto 30px;object-fit:contain}
.eyebrow{text-align:center;font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.title{text-align:center;font-size:31px;margin:9px 0}.sub{text-align:center;color:var(--muted);line-height:1.6;font-size:14px;margin:0 auto 28px;max-width:390px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 18px 45px #0007}
.option{background:#2b211b;border:1px solid #4a392d;border-radius:20px;padding:22px 18px;margin-bottom:14px}
.option:last-child{margin-bottom:0}.option h2{font-size:18px;margin:0 0 7px}.option p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 16px}
.btn{display:block;width:100%;padding:16px;border-radius:15px;text-align:center;text-decoration:none;font-weight:800;font-size:14px;border:0;cursor:pointer}
.primary{background:var(--gold);color:#1d150f}.secondary{background:#33271f;color:var(--cream);border:1px solid #4a392d}
.footer{text-align:center;color:#766b60;font-size:11px;margin-top:25px}

/* Customer card */
.card-top{text-align:center}.card-logo{width:78px;height:78px;border:1px solid #8f7548;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;color:var(--gold);font-weight:900;font-size:22px}
.member{display:inline-block;border:1px solid #80653c;border-radius:20px;padding:7px 13px;color:#d7bd8a;font-size:10px;letter-spacing:1.5px;margin-bottom:17px}
.welcome{color:var(--muted);font-size:13px}.customer-name{font-size:28px;font-weight:800;margin:5px 0}.customer-id{color:#8f8377;font-size:12px;letter-spacing:1px}
.qr-box{width:300px;height:300px;max-width:100%;background:#fff;border-radius:20px;margin:24px auto 14px;display:grid;place-items:center}
#customerQr{width:272px;height:272px}.qr-note{text-align:center;color:var(--muted);font-size:12px}
.points-card{margin-top:17px;background:#19130f;border:1px solid #4b3b2e;border-radius:22px;padding:20px;text-align:center}
.points-circle{width:112px;height:112px;border-radius:50%;border:8px solid #8e7042;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.points-circle strong{font-size:29px}.points-circle span{font-size:10px;letter-spacing:2px;color:var(--muted)}
.points-more{margin-top:13px;color:#c8b99f;font-size:12px}
.dots{display:flex;justify-content:center;gap:7px;margin-top:14px}.dot{width:10px;height:10px;border-radius:50%;background:#55442c}.dot.on{background:var(--gold)}
.face-card{margin-top:17px;background:#19130f;border:1px solid #4b3b2e;border-radius:22px;padding:18px}
.face-card h3{margin:0 0 7px;font-size:17px}.face-card p{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.5}
.face-btn{background:var(--gold);color:#1d150f}.signout{margin-top:10px;background:transparent;color:var(--gold);border:1px solid #6f5835}
.status{text-align:center;color:var(--gold);font-size:12px;min-height:18px;margin-top:9px}
.error{padding:55px 20px;text-align:center;color:#e0b3a5}.error p{color:var(--muted)}
.hidden{display:none!important}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(15,11,8,.97);border-top:1px solid #3d3021;display:flex;justify-content:center;padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:20}
.nav{width:20%;max-width:105px;text-align:center;color:#9f927f;font-size:10px;text-decoration:none}.nav span{display:block;font-size:20px;margin-bottom:3px}.nav.active{color:var(--gold)}
.center-logo{width:38px;height:38px;border-radius:50%;border:1px solid #8e7042;margin:-3px auto 2px;display:grid;place-items:center;color:var(--gold);font-weight:900;font-size:13px}
</style>
</head>

<body>
<div id="app" class="wrap"></div>

<script>
const SUPABASE_URL="https://fgarlyoqobopudfkifbp.supabase.co";
const SUPABASE_KEY="sb_publishable_hmDY0NchM_WPIMRXW26-HA_eaLaVZcY";

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    persistSession:true,
    autoRefreshToken:true,
    detectSessionInUrl:true,
    experimental:{passkey:true}
  }
});

const app=document.getElementById("app");

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function landing(){
  app.innerHTML=`
  <img class="logo" src="logo-1995.png" alt="Al Noor">
  <div class="eyebrow">Al Noor • Loyalty</div>
  <div class="title">Welcome to Al Noor</div>
  <div class="sub">Your loyalty card is ready whenever you are. Choose how you want to continue.</div>
  <div class="panel">
    <div class="option">
      <h2>Already a Customer?</h2>
      <p>Sign in to your existing Al Noor Loyalty account.</p>
      <a class="btn primary" href="login.html">I ALREADY HAVE AN ACCOUNT</a>
    </div>
    <div class="option">
      <h2>New Customer?</h2>
      <p>Create your Al Noor Loyalty Card for the first time.</p>
      <a class="btn secondary" href="register.html">CREATE MY LOYALTY CARD</a>
    </div>
  </div>
  <div class="footer">AL NOOR • LOYALTY MEMBER</div>`;
}

async function getCustomer(){
  // IMPORTANT: if the URL contains a customer token, use it FIRST.
  // This prevents an old/stale login session from loading the wrong card.
  const params=new URLSearchParams(location.search);
  const urlToken=params.get("token");
  const savedToken=localStorage.getItem("alnoor_public_token");
  const token=urlToken||savedToken;

  if(token){
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),10000);
      const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/get_customer_by_token",{
        method:"POST",
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({p_token:token}),
        signal:controller.signal
      });
      clearTimeout(timer);
      const data=await r.json();
      if(r.ok){
        const c=Array.isArray(data)?data[0]:data;
        if(c)return c;
      }
    }catch(e){
      console.error("Token customer lookup failed:",e);
    }
  }

  // No token: use the currently signed-in customer account.
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session){
      const r=await sb.rpc("get_my_customer");
      if(!r.error && r.data){
        return Array.isArray(r.data)?r.data[0]:r.data;
      }
    }
  }catch(e){
    console.error("Session customer lookup failed:",e);
  }

  return null;
}

async function activateFaceID(){
  const btn=document.getElementById("faceBtn");
  const status=document.getElementById("faceStatus");
  if(btn)btn.disabled=true;
  if(status)status.textContent="Waiting for Face ID / device verification...";

  try{
    if(!window.isSecureContext){
      status.textContent="Please open the secure HTTPS Al Noor website.";
      return;
    }

    if(!window.PublicKeyCredential){
      status.textContent="Passkey is not supported on this device/browser.";
      return;
    }

    const {data:{session}}=await sb.auth.getSession();

    if(!session){
      status.textContent="Please sign in first, then activate Face ID.";
      return;
    }

    const {error}=await sb.auth.registerPasskey();

    if(error){
      status.textContent=error.message||"Face ID activation failed.";
      return;
    }

    status.textContent="Face ID is now active on this device.";
    setTimeout(showCustomer,700);

  }catch(e){
    status.textContent=e?.message||"Face ID activation was cancelled or failed.";
  }finally{
    if(btn)btn.disabled=false;
  }
}

async function signOut(){
  await sb.auth.signOut();
  localStorage.removeItem("alnoor_public_token");
  location.href="login.html";
}

async function showCustomer(){
  app.innerHTML=`<div class="panel" style="text-align:center;padding:60px 20px">Loading your Al Noor card...</div>`;

  const c=await getCustomer();

  if(!c){
    app.innerHTML=`
      <div class="error">
        <h2>Customer card not found</h2>
        <p>Your account was found, but the loyalty card could not be loaded.</p>
        <button class="btn primary" onclick="location.href='login.html'">SIGN IN AGAIN</button>
      </div>`;
    return;
  }

  if(c.public_token)localStorage.setItem("alnoor_public_token",c.public_token);

  const points=Math.max(0,Number(c.points||0));
  const current=points%10;
  const more=current===0?10:10-current;

  app.innerHTML=`
    <div class="card-top">
      <div class="card-logo">AN</div>
      <div class="member">AL NOOR • LOYALTY MEMBER</div>
      <div class="welcome">Welcome back</div>
      <div class="customer-name">${esc(c.full_name)}</div>
      <div class="customer-id">CUSTOMER ID · ${esc(c.customer_code)}</div>
    </div>

    <div class="panel" style="margin-top:20px">
      <div class="qr-box"><div id="customerQr"></div></div>
      <div class="qr-note">Show this QR code at the counter</div>

      <div class="points-card">
        <div class="points-circle">
          <strong>${current}/10</strong>
          <span>POINTS</span>
        </div>
        <div class="points-more">${more} MORE POINTS UNTIL YOUR NEXT FREE DRINK!</div>
        <div class="dots">
          ${Array.from({length:10},(_,i)=>`<div class="dot ${i<current?"on":""}"></div>`).join("")}
        </div>
      </div>

      <div class="face-card">
        <h3>Activate Face ID</h3>
        <p>Activate Face ID once on this device. After that, you can use Face ID to sign in without typing your email.</p>
        <button id="faceBtn" class="btn face-btn" onclick="activateFaceID()">ACTIVATE FACE ID</button>
        <div id="faceStatus" class="status"></div>
      </div>

      <button class="btn signout" onclick="signOut()">SIGN OUT</button>
    </div>

    <div class="bottom">
      <a class="nav active" href="index.html"><span>⌂</span>Home</a>
      <a class="nav" href="rewards.html"><span>🎁</span>Rewards</a>
      <a class="nav" href="alnoor.html"><div class="center-logo">AN</div>Al Noor</a>
      <a class="nav" href="locations.html"><span>⌖</span>Locations</a>
      <a class="nav" href="menu.html"><span>☰</span>Menu</a>
    </div>`;

  if(c.public_token){
    new QRCode(document.getElementById("customerQr"),{
      text:String(c.public_token),
      width:272,
      height:272,
      colorDark:"#111111",
      colorLight:"#ffffff",
      correctLevel:QRCode.CorrectLevel.H
    });
  }
}

async function route(){
  const params=new URLSearchParams(location.search);

  if(params.get("register")==="1"){
    location.replace("register.html");
    return;
  }

  // A token in the URL is the most reliable way to open the customer's card.
  if(params.get("token")){
    await showCustomer();
    return;
  }

  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session){
      const c=await getCustomer();
      if(c){
        await showCustomer();
        return;
      }
    }
  }catch(e){
    console.error("Route error:",e);
  }

  landing();
}

route();
</script>
</body>
</html>
