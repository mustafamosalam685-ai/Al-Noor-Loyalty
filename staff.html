<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Noor Staff Scanner</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
    color:#222;
}

.container{
    max-width:520px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:24px;
    margin-top:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#65752b;
}

h2{
    text-align:center;
    margin:10px 0 18px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    background:#65752b;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

#reader{
    width:100%;
    margin-top:18px;
}

.customer{
    display:none;
    text-align:center;
}

.points{
    font-size:58px;
    font-weight:bold;
    color:#65752b;
    margin:12px;
}

.info{
    background:#f5f5f5;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
}

.message{
    text-align:center;
    margin-top:14px;
    min-height:22px;
}

.success{
    color:green;
}

.error{
    color:#b00020;
}
</style>
</head>

<body>

<div class="container">

    <!-- SCANNER -->
    <div class="card">

        <div class="logo">
            AL NOOR
        </div>

        <h2>
            Staff Scanner
        </h2>

        <input
            id="staffPin"
            type="password"
            inputmode="numeric"
            placeholder="Staff PIN"
            value="1234"
        >

        <div id="reader"></div>

        <div id="message" class="message">
            Scan customer QR code
        </div>

    </div>


    <!-- CUSTOMER -->
    <div id="customerCard" class="card customer">

        <div class="logo">
            AL NOOR
        </div>

        <h2 id="customerName"></h2>

        <div class="info">
            Customer ID:
            <strong id="customerCode"></strong>
        </div>

        <div class="points" id="points">
            0
        </div>

        <div>
            LOYALTY POINTS
        </div>

        <div class="info">
            Visits:
            <strong id="visits"></strong>
        </div>

        <div class="info">
            Reward:
            <strong id="reward"></strong>
        </div>

        <div class="info">
            Status:
            <strong id="status"></strong>
        </div>

        <button
            id="addPointButton"
            onclick="addPoint()">
            +1 POINT / VISIT
        </button>

        <button
            onclick="startScanner()">
            SCAN NEXT CUSTOMER
        </button>

        <div
            id="pointMessage"
            class="message">
        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://fgarlyoqobopudfkifbp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hmDY0NchM_WPIMRXW26-HA_eaLaVZcY";


/* =========================
   VARIABLES
========================= */

let scanner = null;
let currentCustomer = null;
let busy = false;


/* =========================
   START
========================= */

window.onload = function(){

    startScanner();

};


/* =========================
   STOP SCANNER
========================= */

async function stopScanner(){

    if(scanner){

        try{
            await scanner.stop();
        }
        catch(e){}

        try{
            await scanner.clear();
        }
        catch(e){}

        scanner = null;
    }

}


/* =========================
   START SCANNER
========================= */

async function startScanner(){

    await stopScanner();

    document.getElementById(
        "customerCard"
    ).style.display = "none";

    document.getElementById(
        "pointMessage"
    ).innerText = "";

    document.getElementById(
        "message"
    ).className = "message";

    document.getElementById(
        "message"
    ).innerText =
    "Allow camera access, then scan customer QR";


    scanner = new Html5Qrcode("reader");


    try{

        await scanner.start(

            {
                facingMode:"environment"
            },

            {
                fps:10,
                qrbox:{
                    width:250,
                    height:250
                }
            },

            async function(decodedText){

                if(busy){
                    return;
                }

                busy = true;

                await stopScanner();

                await openCustomer(decodedText);

                busy = false;

            },

            function(errorMessage){

                // Normal scanning attempts

            }

        );

    }

    catch(error){

        document.getElementById(
            "message"
        ).className = "message error";

        document.getElementById(
            "message"
        ).innerText =
        "Camera error: " + error;

    }

}


/* =========================
   GET TOKEN FROM QR
========================= */

function getToken(qrText){

    try{

        const url =
        new URL(qrText);

        return url.searchParams.get(
            "token"
        );

    }

    catch(e){

        return null;

    }

}


/* =========================
   FIND CUSTOMER
========================= */

async function openCustomer(qrText){

    const token =
    getToken(qrText);


    if(!token){

        document.getElementById(
            "message"
        ).className =
        "message error";

        document.getElementById(
            "message"
        ).innerText =
        "Invalid customer QR code";

        return;

    }


    try{

        document.getElementById(
            "message"
        ).className =
        "message";

        document.getElementById(
            "message"
        ).innerText =
        "Loading customer...";


        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/rpc/get_customer_by_token",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY

                },

                body:JSON.stringify({

                    p_token:token

                })

            }

        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const data =
        await response.json();


        if(!data ||
           data.length === 0){

            throw new Error(
                "Customer not found"
            );

        }


        currentCustomer =
        data[0];


        showCustomer();

    }

    catch(error){

        document.getElementById(
            "message"
        ).className =
        "message error";

        document.getElementById(
            "message"
        ).innerText =
        "Error: " +
        error.message;

    }

}


/* =========================
   SHOW CUSTOMER
========================= */

function showCustomer(){

    const c =
    currentCustomer;


    document.getElementById(
        "customerName"
    ).innerText =
    c.full_name || "";


    document.getElementById(
        "customerCode"
    ).innerText =
    c.customer_code || "";


    document.getElementById(
        "points"
    ).innerText =
    c.points ?? 0;


    document.getElementById(
        "visits"
    ).innerText =
    c.visits ?? 0;


    document.getElementById(
        "reward"
    ).innerText =
    c.reward || "No Reward";


    document.getElementById(
        "status"
    ).innerText =
    c.status || "Active";


    document.getElementById(
        "customerCard"
    ).style.display =
    "block";


    document.getElementById(
        "message"
    ).className =
    "message success";


    document.getElementById(
        "message"
    ).innerText =
    "✓ Customer found";

}


/* =========================
   ADD POINT
========================= */

async function addPoint(){

    if(!currentCustomer){
        return;
    }


    const pin =
    document.getElementById(
        "staffPin"
    ).value.trim();


    const message =
    document.getElementById(
        "pointMessage"
    );


    const button =
    document.getElementById(
        "addPointButton"
    );


    if(!pin){

        message.className =
        "message error";

        message.innerText =
        "Enter staff PIN";

        return;

    }


    button.disabled = true;

    message.className =
    "message";

    message.innerText =
    "Adding point...";


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/rpc/add_customer_point",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY

                },

                body:JSON.stringify({

                    p_customer_code:
                    currentCustomer.customer_code,

                    p_staff_pin:
                    pin

                })

            }

        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const updated =
        await response.json();


        currentCustomer =
        updated;


        showCustomer();


        message.className =
        "message success";


        message.innerText =
        "✓ Point added successfully";


    }

    catch(error){

        message.className =
        "message error";

        message.innerText =
        "Error: " +
        error.message;

    }


    finally{

        button.disabled = false;

    }

}

</script>

</body>
</html>
