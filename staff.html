<!-- STAFF PAGE -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Noor Staff Scanner</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
    margin-top:20px;
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#65752b;
}

h2{
    text-align:center;
}

#reader{
    width:100%;
    margin-top:20px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin-top:10px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#65752b;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.customer{
    display:none;
    text-align:center;
}

.points{
    font-size:55px;
    font-weight:bold;
    color:#65752b;
    margin:15px;
}

.info{
    background:#f2f2f2;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
}

.message{
    text-align:center;
    margin-top:15px;
}

.error{
    color:#b00020;
}

.success{
    color:green;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">AL NOOR</div>

        <h2>Staff Scanner</h2>

        <input
            id="staffPin"
            type="password"
            placeholder="Staff PIN"
            value="1234">

        <div id="reader"></div>

        <div id="message" class="message">
            Scan customer QR code
        </div>

    </div>


    <div id="customerCard" class="card customer">

        <div class="logo">AL NOOR</div>

        <h2 id="customerName"></h2>

        <div class="info">
            Customer ID:
            <strong id="customerCode"></strong>
        </div>

        <div class="points" id="points">0</div>

        <div>LOYALTY POINTS</div>

        <div class="info">
            Visits:
            <strong id="visits"></strong>
        </div>

        <div class="info">
            Reward:
            <strong id="reward"></strong>
        </div>

        <div class="info">
            Status:
            <strong id="status"></strong>
        </div>

        <button onclick="addPoint()">
            +1 POINT / VISIT
        </button>

        <button onclick="startScanner()">
            SCAN NEXT CUSTOMER
        </button>

        <div id="pointMessage" class="message"></div>

    </div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://fgarlyoqobopudfkifbp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hmDY0NchM_WPIMRXW26-HA_eaLaVZcY";


let scanner = null;
let currentCustomer = null;


/* START */

window.onload = function(){
    startScanner();
};


/* SCANNER */

function startScanner(){

    document.getElementById("customerCard")
        .style.display = "none";

    document.getElementById("pointMessage")
        .innerText = "";

    document.getElementById("message")
        .innerText = "Scan customer QR code";

    if(scanner){
        scanner.clear().catch(()=>{});
    }

    scanner = new Html5Qrcode("reader");

    scanner.start(
        {
            facingMode:"environment"
        },
        {
            fps:10,
            qrbox:250
        },
        function(decodedText){

            scanner.clear().catch(()=>{});

            openCustomer(decodedText);

        },
        function(errorMessage){
            // Continue scanning
        }

    ).catch(function(error){

        document.getElementById("message")
            .className = "message error";

        document.getElementById("message")
            .innerText =
            "Camera error: " + error;

    });
}


/* GET TOKEN */

function getToken(url){

    try{

        const parsed = new URL(url);

        return parsed.searchParams.get("token");

    }
    catch(e){

        return null;

    }
}


/* OPEN CUSTOMER */

async function openCustomer(qrText){

    const token = getToken(qrText);

    if(!token){

        document.getElementById("message")
            .className = "message error";

        document.getElementById("message")
            .innerText =
            "Invalid customer QR";

        return;
    }

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/rpc/get_customer_by_token",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                },

                body:JSON.stringify({
                    p_token:token
                })
            }
        );

        if(!response.ok){

            throw new Error(
                await response.text()
            );
        }

        const data = await response.json();

        if(!data || data.length === 0){

            throw new Error(
                "Customer not found"
            );
        }

        currentCustomer = data[0];

        showCustomer();

    }
    catch(error){

        document.getElementById("message")
            .className = "message error";

        document.getElementById("message")
            .innerText = error.message;

    }
}


/* SHOW CUSTOMER */

function showCustomer(){

    const c = currentCustomer;

    document.getElementById("customerName")
        .innerText = c.full_name;

    document.getElementById("customerCode")
        .innerText = c.customer_code;

    document.getElementById("points")
        .innerText = c.points;

    document.getElementById("visits")
        .innerText = c.visits;

    document.getElementById("reward")
        .innerText = c.reward || "No Reward";

    document.getElementById("status")
        .innerText = c.status || "Active";

    document.getElementById("customerCard")
        .style.display = "block";

    document.getElementById("message")
        .innerText = "Customer found";
}


/* ADD POINT */

async function addPoint(){

    if(!currentCustomer){
        return;
    }

    const pin =
        document.getElementById("staffPin")
        .value.trim();

    const message =
        document.getElementById("pointMessage");

    message.className = "message";

    message.innerText = "Adding point...";

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/rpc/add_customer_point",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                },

                body:JSON.stringify({
                    p_customer_code:
                        currentCustomer.customer_code,

                    p_staff_pin:pin
                })
            }
        );

        if(!response.ok){

            const error =
                await response.text();

            throw new Error(error);
        }

        const updated =
            await response.json();

        currentCustomer = updated;

        showCustomer();

        message.className =
            "message success";

        message.innerText =
            "✓ Point added successfully";

    }
    catch(error){

        message.className =
            "message error";

        message.innerText =
            "Error: " + error.message;
    }
}

</script>

</body>
</html>
