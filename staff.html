<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#314b22">

<title>AL NOOR Staff Scanner</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
</script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4efe5;
    color:#222;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:15px;
}

/* HEADER */

.header{
    position:relative;
    min-height:150px;

    border-radius:24px 24px 0 0;

    overflow:hidden;

    background:
    linear-gradient(
        rgba(38,55,25,.88),
        rgba(38,55,25,.88)
    ),
    url("https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=1200&q=80");

    background-size:cover;
    background-position:center;

    color:white;

    padding:25px 20px;

    text-align:center;
}

.logo{
    font-family:Georgia,serif;
    font-size:34px;
    letter-spacing:2px;
    font-weight:bold;
}

.brand{
    font-size:12px;
    letter-spacing:4px;
    margin-top:3px;
}

.staff{
    display:inline-block;

    margin-top:15px;

    padding:8px 15px;

    border-radius:30px;

    background:rgba(255,255,255,.18);

    font-size:13px;
}

/* MAIN CARD */

.main-card{
    background:#fff;

    padding:22px;

    border-radius:0 0 24px 24px;

    box-shadow:
    0 12px 35px rgba(0,0,0,.12);
}

/* PIN */

.pin-box{
    margin-bottom:15px;
}

.pin-box input{
    width:100%;

    padding:13px;

    border:1px solid #ddd;

    border-radius:12px;

    font-size:16px;
}

/* SCANNER */

#reader{
    width:100%;

    overflow:hidden;

    border-radius:18px;

    margin-bottom:15px;
}

.scan-message{
    text-align:center;

    color:#777;

    margin:10px 0 15px;
}

/* CUSTOMER */

.customer{
    display:none;
}

.customer-id{
    background:#f0eee9;

    padding:12px;

    border-radius:12px;

    text-align:center;

    font-size:14px;

    color:#555;
}

.customer-name{
    text-align:center;

    font-size:29px;

    font-weight:bold;

    margin:18px 0 8px;
}

/* POINTS */

.points-area{
    text-align:center;

    padding:10px 0 20px;
}

.points{
    font-size:70px;

    line-height:1;

    font-weight:bold;

    color:#55752d;
}

.points-label{
    margin-top:8px;

    font-size:13px;

    letter-spacing:2px;

    color:#777;
}

/* INFO */

.info-grid{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:8px;

    margin-bottom:18px;
}

.info{
    background:#f4f2ed;

    border-radius:13px;

    padding:12px 5px;

    text-align:center;
}

.info-title{
    font-size:11px;

    color:#777;

    margin-bottom:5px;
}

.info-value{
    font-size:15px;

    font-weight:bold;
}

/* BUTTONS */

button{
    width:100%;

    border:0;

    border-radius:14px;

    padding:16px;

    margin-top:10px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

.add{
    background:#55752d;

    color:white;
}

.redeem{
    background:#a93228;

    color:white;
}

.scan-next{
    background:white;

    color:#333;

    border:1px solid #bbb;
}

/* MESSAGE */

.message{
    text-align:center;

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    display:none;
}

.success{
    display:block;

    background:#e9f6df;

    color:#35651d;
}

.error{
    display:block;

    background:#fde8e6;

    color:#9e2119;
}

/* MODAL */

.modal{
    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.65);

    z-index:1000;

    align-items:center;

    justify-content:center;

    padding:20px;
}

.modal-box{
    width:100%;

    max-width:420px;

    background:white;

    border-radius:22px;

    padding:25px;

    text-align:center;

    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.modal-title{
    background:#fde8e6;

    color:#9e2119;

    padding:15px;

    border-radius:12px;

    font-size:21px;

    font-weight:bold;
}

.modal-text{
    margin:18px 0;

    line-height:1.7;

    color:#444;
}

.modal-buttons{
    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:10px;
}

.cancel{
    background:#e9e9e9;

    color:#333;
}

.confirm{
    background:#a93228;

    color:white;
}

/* FOOTER */

.footer{
    text-align:center;

    padding:20px 0 5px;

    color:#777;

    font-family:Georgia,serif;

    font-size:14px;
}

@media(max-width:380px){

    .info-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            AL NOOR
        </div>

        <div class="brand">
            MODERN BAKERY
        </div>

        <div class="staff">
            👤 Staff Mode
        </div>

    </div>


    <div class="main-card">


        <!-- PIN -->

        <div class="pin-box">

            <input
                id="staffPin"
                type="password"
                value="1234"
                placeholder="Staff PIN">

        </div>


        <!-- SCANNER -->

        <div id="reader"></div>

        <div
            id="scanMessage"
            class="scan-message">

            Scan customer QR code

        </div>


        <!-- CUSTOMER -->

        <div
            id="customer"
            class="customer">


            <div class="customer-id">

                Customer ID:
                <strong id="customerCode">
                </strong>

            </div>


            <div
                id="customerName"
                class="customer-name">
            </div>


            <!-- POINTS -->

            <div class="points-area">

                <div
                    id="points"
                    class="points">

                    0

                </div>

                <div class="points-label">

                    LOYALTY POINTS

                </div>

            </div>


            <!-- INFO -->

            <div class="info-grid">

                <div class="info">

                    <div class="info-title">
                        VISITS
                    </div>

                    <div
                        id="visits"
                        class="info-value">
                    </div>

                </div>


                <div class="info">

                    <div class="info-title">
                        REWARD
                    </div>

                    <div
                        id="reward"
                        class="info-value">
                    </div>

                </div>


                <div class="info">

                    <div class="info-title">
                        STATUS
                    </div>

                    <div
                        id="status"
                        class="info-value">
                    </div>

                </div>

            </div>


            <!-- ADD POINT -->

            <button
                class="add"
                onclick="addPoint()">

                ➕ &nbsp; +1 POINT / VISIT

            </button>


            <!-- REDEEM -->

            <button
                class="redeem"
                onclick="openRedeem()">

                🎁 &nbsp; REDEEM REWARD

            </button>


            <!-- SCAN NEXT -->

            <button
                class="scan-next"
                onclick="startScanner()">

                ▣ &nbsp; SCAN NEXT CUSTOMER

            </button>


            <div
                id="message"
                class="message">
            </div>

        </div>


        <div class="footer">

            Fresh Moments • Better Rewards

        </div>

    </div>

</div>


<!-- =========================
     REDEEM MODAL
========================= -->

<div
    id="redeemModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-title">

            🎁 Redeem Reward?

        </div>

        <div
            id="redeemText"
            class="modal-text">
        </div>

        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeRedeem()">

                CANCEL

            </button>

            <button
                class="confirm"
                onclick="confirmRedeem()">

                CONFIRM REDEEM

            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://fgarlyoqobopudfkifbp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hmDY0NchM_WPIMRXW26-HA_eaLaVZcY";


/* =========================
   VARIABLES
========================= */

let scanner = null;

let currentCustomer = null;


/* =========================
   START
========================= */

window.onload = function(){

    startScanner();

};


/* =========================
   START SCANNER
========================= */

function startScanner(){

    document
    .getElementById("customer")
    .style.display = "none";


    document
    .getElementById("message")
    .className = "message";


    document
    .getElementById("message")
    .innerText = "";


    document
    .getElementById("scanMessage")
    .innerText =
    "Scan customer QR code";


    if(scanner){

        scanner
        .clear()
        .catch(()=>{});

    }


    scanner =
    new Html5Qrcode("reader");


    scanner.start(

        {
            facingMode:"environment"
        },

        {
            fps:10,
            qrbox:250
        },

        function(decodedText){

            scanner
            .clear()
            .catch(()=>{});

            openCustomer(decodedText);

        },

        function(errorMessage){

            // Ignore scan errors

        }

    )
    .catch(function(error){

        showMessage(
            "Camera error: " + error,
            true
        );

    });

}


/* =========================
   GET TOKEN FROM QR
========================= */

function getToken(qrText){

    try{

        const url =
        new URL(qrText);

        return url
        .searchParams
        .get("token");

    }

    catch(e){

        return null;

    }

}


/* =========================
   OPEN CUSTOMER
========================= */

async function openCustomer(qrText){

    const token =
    getToken(qrText);


    if(!token){

        showMessage(
            "Invalid customer QR",
            true
        );

        return;

    }


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/rpc/get_customer_by_token",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY

                },

                body:JSON.stringify({

                    p_token:token

                })

            }

        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const data =
        await response.json();


        if(!data ||
           data.length === 0){

            throw new Error(
                "Customer not found"
            );

        }


        currentCustomer =
        data[0];


        showCustomer();

    }

    catch(error){

        showMessage(
            error.message,
            true
        );

    }

}


/* =========================
   SHOW CUSTOMER
========================= */

function showCustomer(){

    const c =
    currentCustomer;


    document
    .getElementById("customerCode")
    .innerText =
    c.customer_code;


    document
    .getElementById("customerName")
    .innerText =
    c.full_name;


    document
    .getElementById("points")
    .innerText =
    c.points;


    document
    .getElementById("visits")
    .innerText =
    c.visits;


    document
    .getElementById("reward")
    .innerText =
    c.reward ||
    "No Reward";


    document
    .getElementById("status")
    .innerText =
    c.status ||
    "Active";


    document
    .getElementById("customer")
    .style.display =
    "block";


    document
    .getElementById("scanMessage")
    .innerText =
    "Customer found";

}


/* =========================
   ADD POINT
========================= */

async function addPoint(){

    if(!currentCustomer){

        return;

    }


    const pin =
    document
    .getElementById("staffPin")
    .value
    .trim();


    showMessage(
        "Adding point...",
        false
    );


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/rpc/add_customer_point",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY

                },

                body:JSON.stringify({

                    p_customer_code:
                    currentCustomer.customer_code,

                    p_staff_pin:
                    pin

                })

            }

        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const updated =
        await response.json();


        currentCustomer =
        updated;


        showCustomer();


        showMessage(
            "✓ Point added successfully",
            false
        );

    }

    catch(error){

        showMessage(
            "Error: " +
            error.message,
            true
        );

    }

}


/* =========================
   OPEN REDEEM
========================= */

function openRedeem(){

    if(!currentCustomer){

        return;

    }


    const points =
    Number(
        currentCustomer.points
    );


    if(points < 10){

        showMessage(
            "Customer needs 10 points for a FREE DRINK.",
            true
        );

        return;

    }


    const after =
    points - 10;


    document
    .getElementById("redeemText")
    .innerHTML =

    "Subtract <strong>10 points</strong> " +
    "for <strong>FREE DRINK</strong>?<br><br>" +

    "Customer: <strong>" +
    currentCustomer.full_name +
    "</strong><br>" +

    "Current Points: <strong>" +
    points +
    "</strong> → After: <strong>" +
    after +
    "</strong>";


    document
    .getElementById("redeemModal")
    .style.display =
    "flex";

}


/* =========================
   CLOSE REDEEM
========================= */

function closeRedeem(){

    document
    .getElementById("redeemModal")
    .style.display =
    "none";

}


/* =========================
   CONFIRM REDEEM
========================= */

async function confirmRedeem(){

    if(!currentCustomer){

        return;

    }


    const pin =
    document
    .getElementById("staffPin")
    .value
    .trim();


    closeRedeem();


    showMessage(
        "Redeeming reward...",
        false
    );


    try{

        const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/rpc/redeem_customer_reward",

            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json",

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    "Bearer " +
                    SUPABASE_KEY

                },

                body:JSON.stringify({

                    p_customer_code:
                    currentCustomer.customer_code,

                    p_staff_pin:
                    pin

                })

            }

        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const updated =
        await response.json();


        currentCustomer =
        updated;


        showCustomer();


        showMessage(
            "✓ FREE DRINK redeemed successfully",
            false
        );

    }

    catch(error){

        showMessage(
            "Error: " +
            error.message,
            true
        );

    }

}


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    error
){

    const box =
    document.getElementById(
        "message"
    );


    box.innerText =
    text;


    box.className =
    error
    ? "message error"
    : "message success";

}

</script>

</body>
</html>
